<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio Shuttle — OutputDock concept</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f5f4;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --paper: #ffffff;
        --image-tint: #efb44b;
        --video-tint: #6eb4a7;
        --active-tint: var(--image-tint);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
      }

      .shell {
        min-height: 100vh;
        padding: 1rem 1.25rem 2rem;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
        max-width: 74rem;
        margin: 0 auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 0.88rem;
        font-weight: 730;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        display: grid;
        width: 1.85rem;
        height: 1.85rem;
        place-items: center;
        border-radius: 45% 55% 52% 48% / 55% 43% 57% 45%;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.72rem;
      }

      .site-links {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .site-links a {
        color: inherit;
        text-decoration: none;
      }

      .dock {
        --travel-ease: cubic-bezier(0.22, 1.35, 0.45, 1);
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, minmax(8.6rem, 1fr));
        width: min(22rem, 42vw);
        min-width: 19rem;
        padding: 0.18rem 0;
        isolation: isolate;
      }

      .rail {
        position: absolute;
        top: 1.26rem;
        left: 25%;
        right: 25%;
        z-index: -2;
        height: 1px;
        background: var(--line);
      }

      .rail::after {
        content: "";
        position: absolute;
        inset: -2px 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 10px,
          color-mix(in srgb, var(--muted) 30%, transparent) 10px 12px
        );
        mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
      }

      .carriage {
        position: absolute;
        top: 0;
        left: calc(25% - 1.275rem);
        z-index: -1;
        width: 2.55rem;
        height: 2.55rem;
        border: 1px solid color-mix(in srgb, var(--active-tint) 76%, var(--ink));
        border-radius: 46% 54% 48% 52% / 54% 44% 56% 46%;
        background: color-mix(in srgb, var(--active-tint) 35%, var(--paper));
        box-shadow: 0 5px 16px color-mix(in srgb, var(--active-tint) 22%, transparent);
        transition:
          left 420ms var(--travel-ease),
          border-radius 320ms ease,
          background 220ms ease,
          border-color 220ms ease,
          box-shadow 220ms ease;
      }

      .focus-video .carriage {
        left: calc(75% - 1.275rem);
        border-radius: 25% 45% 28% 42%;
      }

      .stop {
        display: grid;
        grid-template-rows: 2.55rem auto auto;
        justify-items: center;
        min-width: 0;
        padding: 0 0.75rem 0.28rem;
        color: var(--muted);
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .glyph {
        display: grid;
        width: 2.55rem;
        height: 2.55rem;
        place-items: center;
        color: var(--muted);
        transition:
          color 180ms ease,
          transform 320ms var(--travel-ease);
      }

      .glyph svg {
        width: 1.55rem;
        overflow: visible;
      }

      .stop[aria-current="page"] {
        color: var(--ink);
      }

      .stop[aria-current="page"] .glyph {
        color: var(--ink);
        transform: scale(1.04);
      }

      .stop:hover .glyph,
      .stop:focus-visible .glyph {
        color: var(--ink);
        transform: translateY(-1px);
      }

      .name {
        margin-top: 0.32rem;
        font-size: 0.82rem;
        font-weight: 690;
        letter-spacing: -0.015em;
      }

      .hint {
        margin-top: 0.08rem;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.64rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.025em;
        opacity: 0.28;
        transform: translateY(-2px);
        transition:
          opacity 180ms ease,
          transform 240ms ease;
      }

      .stop[aria-current="page"] .hint,
      .stop:hover .hint,
      .stop:focus-visible .hint {
        opacity: 1;
        transform: none;
      }

      .aperture .capture {
        transform-origin: center;
      }

      .stop[aria-current="page"] .aperture .capture {
        animation: capture 430ms var(--travel-ease);
      }

      .filmstrip .playhead {
        transform-origin: center;
      }

      .stop[aria-current="page"] .filmstrip .playhead {
        animation: scrub 1.25s ease-in-out infinite;
      }

      .studio {
        display: grid;
        min-height: calc(100vh - 8rem);
        place-items: center;
        padding: 3rem 1rem 1rem;
      }

      .hero {
        display: grid;
        width: min(31rem, 76vw);
        aspect-ratio: 1.28;
        place-items: center;
        border-radius: 2rem;
        background: var(--paper);
      }

      .bot {
        position: relative;
        width: min(12rem, 35vw);
        aspect-ratio: 1;
        border-radius: 48% 52% 46% 54% / 55% 45% 55% 45%;
        background: var(--active-tint);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
        transition:
          background 320ms ease,
          border-radius 420ms var(--travel-ease);
      }

      .shell.video-mode .bot {
        border-radius: 42% 58% 55% 45% / 52% 43% 57% 48%;
        animation: breathe 2.4s ease-in-out infinite;
      }

      .eyes {
        position: absolute;
        top: 41%;
        left: 50%;
        display: flex;
        gap: 2.15rem;
        transform: translateX(-50%);
      }

      .eye {
        width: 0.58rem;
        height: 1.5rem;
        border-radius: 99px;
        background: var(--ink);
      }

      .mode-readout {
        position: absolute;
        bottom: 1rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .mobile-note {
        max-width: 34rem;
        margin: 0.75rem auto 0;
        color: var(--muted);
        font-size: 0.72rem;
        text-align: center;
      }

      :focus-visible {
        border-radius: 0.5rem;
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      @keyframes capture {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        55% {
          transform: scale(1.35);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes scrub {
        0%,
        100% {
          transform: translateX(-4px);
        }
        50% {
          transform: translateX(4px);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1) rotate(-0.4deg);
        }
        50% {
          transform: scale(1.025) rotate(0.4deg);
        }
      }

      @media (max-width: 40rem) {
        .shell {
          padding: 0.8rem 0.8rem 7rem;
        }

        .topbar {
          grid-template-columns: 1fr auto;
        }

        .site-links {
          gap: 0.8rem;
        }

        .dock {
          position: fixed;
          inset: auto 0 0;
          z-index: 30;
          grid-column: 1 / -1;
          width: 100%;
          min-width: 0;
          padding: 0.55rem max(1rem, calc((100vw - 28rem) / 2))
            calc(0.5rem + env(safe-area-inset-bottom));
          border-top: 1px solid var(--line);
          background: color-mix(in srgb, var(--paper) 94%, transparent);
          backdrop-filter: blur(12px);
        }

        .rail {
          top: 1.63rem;
          left: 25%;
          right: 25%;
        }

        .carriage {
          top: 0.38rem;
        }

        .studio {
          min-height: calc(100vh - 5rem);
          padding-top: 1.5rem;
        }

        .hero {
          width: min(100%, 31rem);
        }

        .bot {
          width: min(10rem, 42vw);
        }

        .mobile-note {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .carriage,
        .glyph,
        .hint,
        .bot {
          transition: none;
        }

        .stop[aria-current="page"] .aperture .capture,
        .stop[aria-current="page"] .filmstrip .playhead,
        .shell.video-mode .bot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">G</span>
          Grok bot studio
        </div>

        <nav
          class="dock focus-image"
          data-output-dock
          aria-label="Choose a studio desk"
          style="--active-tint: var(--image-tint)"
        >
          <span class="rail" aria-hidden="true"></span>
          <span class="carriage" aria-hidden="true"></span>

          <a
            class="stop"
            href="?desk=image"
            data-desk="image"
            data-tint="#efb44b"
            aria-current="page"
            aria-label="Open the Image desk"
          >
            <span class="glyph aperture" aria-hidden="true">
              <svg viewBox="0 0 30 30" fill="none">
                <rect x="4.5" y="4.5" width="21" height="21" rx="6" stroke="currentColor" stroke-width="1.5" />
                <path d="M8 10.5h14M8 19.5h14" stroke="currentColor" stroke-width="1.2" opacity=".35" />
                <circle class="capture" cx="15" cy="15" r="4.2" fill="currentColor" />
              </svg>
            </span>
            <span class="name">Image</span>
            <span class="hint">PNG · SVG</span>
          </a>

          <a
            class="stop"
            href="?desk=video"
            data-desk="video"
            data-tint="#6eb4a7"
            aria-label="Open the Video desk"
          >
            <span class="glyph filmstrip" aria-hidden="true">
              <svg viewBox="0 0 30 30" fill="none">
                <rect x="3.5" y="7" width="23" height="16" rx="3.5" stroke="currentColor" stroke-width="1.5" />
                <path d="M9 7v16M21 7v16M3.5 11h5.5M21 11h5.5M3.5 19h5.5M21 19h5.5" stroke="currentColor" stroke-width="1.1" opacity=".48" />
                <path d="m13 11.8 5 3.2-5 3.2Z" fill="currentColor" />
                <path class="playhead" d="M11 24.7h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </span>
            <span class="name">Video</span>
            <span class="hint">GIF · MP4 · 4s</span>
          </a>
        </nav>

        <nav class="site-links" aria-label="Site">
          <a href="#settings">Settings</a>
          <a href="#about">About</a>
        </nav>
      </header>

      <section class="studio" id="studio" data-desk="image" aria-label="Bot preview">
        <div class="hero">
          <div class="bot" aria-hidden="true">
            <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
          </div>
          <p class="mode-readout" aria-live="polite">Image desk · ready for PNG or SVG</p>
        </div>
      </section>

      <p class="mobile-note">
        Narrow the window to see the same shuttle become a safe-area-aware bottom dock.
      </p>
    </main>

    <script>
      const dock = document.querySelector("[data-output-dock]");
      const shell = document.querySelector(".shell");
      const studio = document.querySelector("#studio");
      const readout = document.querySelector(".mode-readout");
      const stops = [...dock.querySelectorAll("[data-desk]")];

      function choose(stop) {
        const kind = stop.dataset.desk;
        const tint = stop.dataset.tint;

        dock.classList.toggle("focus-image", kind === "image");
        dock.classList.toggle("focus-video", kind === "video");
        shell.classList.toggle("video-mode", kind === "video");
        dock.style.setProperty("--active-tint", tint);
        studio.dataset.desk = kind;

        stops.forEach((item) => {
          if (item === stop) item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });

        readout.textContent =
          kind === "image"
            ? "Image desk · ready for PNG or SVG"
            : "Video desk · ready for GIF or MP4 · 4s";
      }

      stops.forEach((stop) => {
        stop.addEventListener("click", (event) => {
          event.preventDefault();
          choose(stop);
        });
      });
    </script>
  </body>
</html>
